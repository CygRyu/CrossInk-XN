# Personal fork: builds the X3/X4 firmware with and without the
# Path of Immortal Reading game, and attaches both .bin files to the run.
#
# Run it from the Actions tab ("Cultivation firmware" -> "Run workflow", pick
# a branch), or push to main or any feat/ branch. Download the .bin files from
# the run's "Artifacts" section.
#
# This file is new (not part of upstream CrossInk), so syncing the fork
# with upstream never conflicts with it.
name: Cultivation firmware

on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

concurrency:
  group: cultivation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: cultivation   # game on
            firmware: firmware-x3-x4-cultivation
          - environment: default       # game off: proves the stock build is unchanged
            firmware: firmware-x3-x4
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive   # pulls freeink-sdk at the commit your fork pins

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # Same step as upstream release.yml: custom_sdkconfig runs a nested
          # `pio run` from ~/.platformio/penv and needs the same core version.
          pio pkg install -e "${{ matrix.environment }}"
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"

      - name: Balance simulator tests
        if: matrix.environment == 'cultivation'
        run: python3 tools/cultivation/test_balance_sim.py

      - name: Game core host tests
        if: matrix.environment == 'cultivation'
        run: |
          set -euo pipefail
          cmake -S test/cultivation -B build/cultivation-tests
          cmake --build build/cultivation-tests -j 4
          ctest --test-dir build/cultivation-tests --output-on-failure

      - name: Build ${{ matrix.environment }}
        run: |
          set -euo pipefail
          pio run -j1 -e ${{ matrix.environment }} | tee pio.log
          {
            echo "## ${{ matrix.environment }}"
            grep -E "RAM:\s|Flash:\s" pio.log | while read -r line; do echo "- ${line}"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.firmware }}-${{ github.sha }}
          path: .pio/build/${{ matrix.environment }}/${{ matrix.firmware }}.bin
          if-no-files-found: error
